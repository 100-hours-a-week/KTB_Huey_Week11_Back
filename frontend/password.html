<!DOCTYPE html>
<!-- 비밀번호 수정 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>edit password</title>
        <link href="basic.css" rel="stylesheet">
        <script src="header.js" defer></script>
        <script src="password.js" defer></script>
    </head>
    <body>
        <div class="board-header">
            <div>
                <h1>
                    아무 말 대잔치
                </h1>
            </div>
            <div>
                <button id="menu-button">
                    <img id="user-profile" class="user-profile-small">
                </button>
                
                <div id="dropdown-menu" class="dropdown-menu hidden">
                    <a href="user.html">회원정보수정</a>
                    <a href="password.html">비밀번호수정</a>
                    <button id="logout">로그아웃</button>
                </div>
            </div>
        </div>

        <article>
            <header>
                <h1>비밀번호 수정</h1>
            </header>

            <form id="password-form">
                <div>
                    <label>비밀번호</label>
                    <input type="text" placeholder="비밀번호를 입력하세요" name="newPassword" id="newPassword"/>
                    <small id="helper-text-password">* helper text</small>
                </div>
                <div>
                    <label>비밀번호 확인</label>
                    <input type="text" placeholder="비밀번호를 한번 더 입력하세요" id="newPassword-confirm"/>
                    <small id="helper-text-password-confirm">* helper text</small>
                </div>
                <div>
                    <div>
                        <input type="submit" value="수정하기" />
                    </div>
                </div>
            </form>
        </article>
    </body>
</html>
