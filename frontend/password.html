<!DOCTYPE html>
<!-- 비밀번호 수정 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>edit password</title>
        <link href="basic.css" rel="stylesheet">
        <script src="password.js" defer></script>
    </head>
    <body>
        <article>
            <header>
                <h1>비밀번호 수정</h1>
            </header>

            <form id="password-form">
                <div>
                    <label>비밀번호</label>
                    <input type="text" placeholder="비밀번호를 입력하세요" name="newPassword" id="newPassword"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <label>비밀번호 확인</label>
                    <input type="text" placeholder="비밀번호를 한번 더 입력하세요"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <div>
                        <input type="submit" value="수정하기" />
                    </div>
                </div>
            </form>
        </article>
    </body>
</html>
