<!DOCTYPE html>
<!-- 게시글 작성 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>make post</title>
        <link href="basic.css" rel="stylesheet">
    </head>
    <body>
        <article>
            <header>
                <h1>게시글 작성</h1>
            </header>

            <form>
                <div>
                    <label>제목*</label>
                    <input type="text" placeholder="제목을 입력해주세요. (최대 26글자)"/>
                </div>
                <div>
                    <label>내용*</label>
                    <input type="text" placeholder="내용을 입력해주세요."/>
                    <small>* helper text</small>
                </div>
                <div>
                    <label>이미지</label>
                    <input type="file"/>
                </div>
                <div>
                    <div>
                        <input type="submit" value="완료" />
                    </div>
                </div>
            </form>
        </article>
    </body>
</html>
