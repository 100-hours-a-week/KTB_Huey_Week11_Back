<!DOCTYPE html>
<!-- 게시글 작성 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>make post</title>
        <script src="auth.js"></script>
        <script src="header.js" defer></script>
        <script src="post.js" defer></script>
        <script src="attach.js" defer></script>
        <link href="basic.css" rel="stylesheet">
    </head>
    <body>
        <div class="board-header">
            <div>
                <a href="index.html">
                    <h1>
                        &lt;
                    </h1>
                </a>
            </div>
            <div>
                <h1>
                    아무 말 대잔치
                </h1>
            </div>
            <div>
                <button id="menu-button">
                    <img id="user-profile" class="user-profile-small">
                </button>
                
                <div id="dropdown-menu" class="dropdown-menu hidden">
                    <a href="user.html">회원정보수정</a>
                    <a href="password.html">비밀번호수정</a>
                    <button id="logout">로그아웃</button>
                </div>
            </div>
        </div>
        
        <article>
            <header>
                <h1>게시글 작성</h1>
            </header>

            <form id="post-form">
                <div>
                    <label>제목*</label>
                    <input type="text" name="title" id="title" maxlength=26 placeholder="제목을 입력해주세요. (최대 26글자)"/>
                </div>
                <div>
                    <label>내용*</label>
                    <input type="text" name="content" id="content" placeholder="내용을 입력해주세요."/>
                    <small id="helper-text-post" class="helper"></small>
                </div>
                 <div>
                    <input name="imageUrl" id="imageUrl" />
                </div>
            </form>

            <form id="attach">
                <div>
                    <label>이미지</label>
                    <input type="file" name="image" id="image"/>
                </div>
            </form>

            <div>
                <div>
                    <input type="submit" id="post-submit" disabled form="post-form" value="완료" />
                </div>                
            </div>
        </article>
    </body>
</html>
