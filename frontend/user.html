<!DOCTYPE html>
<!-- 회원 정보 조회 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>edit profile</title>
        <link href="basic.css" rel="stylesheet">
        <script src="user.js" defer></script>
        <script src="profile.js" defer></script>
    </head>
    <body>
        <article>
            <header>
                <h1>회원정보수정</h1>
            </header>

            <form id="profile-image">
                <div>
                    <label>프로필 사진*</label>
                    <input type="image" name="image" id="image"/>
                </div>
            </form>

            <form id="user-form">
                <div>
                    <label>이메일</label>
                    <p id="email">startupcode@gmail.com</p>
                </div>
                <div>
                    <label>닉네임</label>
                    <input type="text" name="nickname" id="nickname"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <input type="hidden" name="profileImageUrl" id="imageUrl" />
                </div>
                <div>
                    <div>
                        <input type="submit" value="수정하기" />
                    </div>
                </div>
            </form>

            <button>회원 탈퇴</button>

            <button>수정완료</button>
        </article>
    </body>
</html>
