<!DOCTYPE html>
<!-- 회원 정보 조회 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>edit profile</title>
        <script src="auth.js"></script>
        <script src="header.js" defer></script>
        <script src="user.js" defer></script>
        <script src="profile.js" defer></script>
        <script src="modal.js" defer></script>
        <link href="basic.css" rel="stylesheet">
        <link href="modal.css" rel="stylesheet">
        <link href="user.css" rel="stylesheet">
    </head>
    <body>
        <div class="board-header">
            <div>
                <h1>
                    아무 말 대잔치
                </h1>
            </div>

            <div>
                <button id="menu-button">
                    <img id="user-profile" class="user-profile-small">
                </button>
                
                <div id="dropdown-menu" class="dropdown-menu hidden">
                    <a href="user.html">회원정보수정</a>
                    <a href="password.html">비밀번호수정</a>
                    <button id="logout">로그아웃</button>
                </div>
            </div>
        </div>
        
        <article>
            <div>
            <header>
                <h1>회원정보수정</h1>
            </header>

            <form id="profile-image">
                <div>
                    <p>프로필 사진*</p>
                </div>
                <div>
                    <label for="image">
                        <img id="preview" src="images.png">
                    </label>

                    <input type="file" id="image" accept="image/*" name="profileImage">
                </div>
            </form>

            <form id="user-form">
                <div>
                    <label>이메일</label>
                    <p id="email">startupcode@gmail.com</p>
                </div>
                <div>
                    <label>닉네임</label>
                    <input type="text" name="nickname" id="nickname"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <input name="profileImageUrl" id="imageUrl" />
                </div>
                <div>
                    <div>
                        <input type="submit" value="수정하기" />
                    </div>
                </div>
            </form>

            <button id="user-delete">회원 탈퇴</button>
            
            <div id="toast" class="hidden">
                <p>수정완료</p>
            </div>
        
            </div>
        </article>

        <div id="user-delete-modal" class="modal hidden">
            <div class="modal-content">
                <strong>
                    회원탈퇴 하시겠습니까?
                </strong>

                <p>
                    작성된 게시글과 댓글은 삭제됩니다.
                </p>

                <div class="vert">
                    <button id="user-delete-modal-cancel">취소</button>
                    <button id="withdraw">확인</button>
                </div>
            </div>
        </div>
    </body>
</html>
