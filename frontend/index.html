<!DOCTYPE html>
<!-- 게시글 목록 조회 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>Posts</title>
        <link href="basic.css" rel="stylesheet">
        <link href="index.css" rel="stylesheet">
    </head>
    <body>
        <article>
            <div>
                <div class="center">
                    <header>
                        <h1>
                            안녕하세요, <br>
                            아무 말 대잔치 <strong>게시판</strong>입니다.
                        </h1>
                    </header>
                </div>

                <div class="right">
                    <button>게시글 작성</button>
                </div>

                <section>
                    <div>
                        <button>
                            <div>
                                <header>
                                    <div class="post-title">
                                        <h2>제목 1</h2>
                                    </div>
                                    <div class="vert between">
                                        <div class="vert">
                                            <p>좋아요 0</p>
                                            <p>댓글 0</p>
                                            <p>조회수 0</p>
                                        </div>
                                        <div>
                                            <time>2021-01-01 00:00:00</time>
                                        </div>
                                    </div>
                                </header>

                                <footer class="vert">
                                    <img>
                                    <p>더미 작성자 1</p>
                                </footer>
                            </div>
                        </button>
                    </div>
                </section>
            </div>
        </article>
    </body>
</html>
