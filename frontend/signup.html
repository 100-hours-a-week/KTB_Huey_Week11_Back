<!DOCTYPE html>
<!-- 회원가입 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>Sign in</title>
        <link href="basic.css" rel="stylesheet">
    </head>
    <body>
        <article>
            <header>
                <h1>회원가입</h1>
            </header>

            <form>
                <div>
                    <label>프로필 사진</label>
                    <small>* helper text</small>
                    <input type="image" />
                </div>
                <div>
                    <label>이메일*</label>
                    <input type="text" placeholder="이메일을 입력하세요"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <label>비밀번호*</label>
                    <input type="text" placeholder="비밀번호를 입력하세요"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <label>비밀번호 확인*</label>
                    <input type="text" placeholder="비밀번호를 한번 더 입력하세요"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <label>닉네임*</label>
                    <input type="text" placeholder="닉네임을 입력하세요"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <div>
                        <input type="submit" value="회원가입" />
                    </div>
                </div>
            </form>

            <button>로그인하러 가기</button>
        </article>
    </body>
</html>
