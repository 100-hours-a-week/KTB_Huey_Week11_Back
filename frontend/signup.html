<!DOCTYPE html>
<!-- 회원가입 페이지 -->

<!-- UserRequestDto: email, password, nickname, profileImageUrl -->
<!-- UserResponseDto: userId -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>Sign in</title>
        <script src="header.js" defer></script>
        <script src="signup.js" defer></script>
        <script src="profile.js" defer></script>
        <link href="basic.css" rel="stylesheet">
    </head>
    <body>
        <div class="board-header">
            <div>
                <a href="index.html">
                    <h1>
                        &lt;
                    </h1>
                </a>
            </div>

            <div>
                <h1>
                    아무 말 대잔치
                </h1>
            </div>
        </div>
        
        <article>
            <header>
                <h1>회원가입</h1>
            </header>

            <div>
            <form id="profile-image">
                <div>
                    <label>프로필 사진</label>
                    <small id="helper-text-profile-image" class="helper"></small>
                </div>

                <div>
                    <label for="image">
                        <img id="preview" src="images.png">
                    </label>

                    <input type="file" id="image" accept="image/*" name="profileImage">
                </div>
            </form>
        
            <form id="signup-form">
                <div>
                    <label>이메일*</label>
                    <input type="text" name="email" id="email" placeholder="이메일을 입력하세요"/>
                    <small id="helper-text-email" class="helper"></small>
                </div>
                <div>
                    <label>비밀번호*</label>
                    <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요"/>
                    <small id="helper-text-password" class="helper"></small>
                </div>
                <div>
                    <label>비밀번호 확인*</label>
                    <input type="password" id="password-confirm" placeholder="비밀번호를 한번 더 입력하세요"/>
                    <small id="helper-text-password-confirm" class="helper"></small>
                </div>
                <div>
                    <label>닉네임*</label>
                    <input type="text" name="nickname" id="nickname" placeholder="닉네임을 입력하세요"/>
                    <small id="helper-text-nickname" class="helper"></small>
                </div>
                <div>
                    <input name="profileImageUrl" id="imageUrl" />
                </div>
                <div>
                    <div>
                        <input type="submit" id="signup-submit" disabled value="회원가입" />
                    </div>
                </div>
            </form>
            </div>

            <a href="/login.html">로그인하러 가기</a>
        </article>
    </body>
</html>
