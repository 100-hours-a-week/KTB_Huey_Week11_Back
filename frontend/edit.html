<!DOCTYPE html>
<!-- 게시글 수정 페이지 -->

<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>edit post</title>
        <link href="basic.css" rel="stylesheet">
    </head>
    <body>
        <article>
            <header>
                <h1>게시글 수정</h1>
            </header>

            <form>
                <div>
                    <label>제목*</label>
                    <input type="text"/>
                </div>
                <div>
                    <label>내용*</label>
                    <input type="text"/>
                    <small>* helper text</small>
                </div>
                <div>
                    <label>이미지</label>
                    <input type="file" />
                </div>
                <div>
                    <div>
                        <input type="submit" value="수정하기" />
                    </div>                  
                </div>
            </form>
        </article>
    </body>
</html>
